<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sheet cutting calculator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef1f5;--surface:#fff;--ink:#14213d;--muted:#5b6578;--line:#cfd6e2;--accent:#e4572e;--accent-ink:#fff;--piece:#c9dcf5;--piece2:#f6d3c6;--grain:#5b7fb0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--surface:#182136;--ink:#e8edf7;--muted:#9aa5ba;--line:#2c3856;--accent:#ff7a52;--accent-ink:#1a1006;--piece:#27456f;--piece2:#6b3b2a;--grain:#7fa3d6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1624;--surface:#182136;--ink:#e8edf7;--muted:#9aa5ba;--line:#2c3856;--accent:#ff7a52;--accent-ink:#1a1006;--piece:#27456f;--piece2:#6b3b2a;--grain:#7fa3d6;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.4}
main{max-width:1280px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}
.hint{color:var(--muted);font-size:.9rem;margin:0 0 20px}
h2{font-size:1rem;font-weight:800;margin:4px 0 12px}
.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
label{display:block;font-size:.9rem;font-weight:600;margin:0 0 4px}
input,select{width:100%;font:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);margin-bottom:14px}
input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
hr{border:0;border-top:1px solid var(--line);margin:6px 0 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px;margin-bottom:16px}
.stat .v{font-size:2.2rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat .k{color:var(--muted);font-size:.85rem;margin-top:4px}
.note{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.err{color:var(--accent);font-weight:600}
svg{width:100%;height:auto;max-height:85vh;display:block}
.sheet{fill:var(--surface);stroke:var(--ink)}
.usable{fill:none;stroke:var(--muted);stroke-dasharray:6 5}
.p0{fill:var(--piece);stroke:var(--ink)}
.p1{fill:var(--piece2);stroke:var(--ink)}
.pat line{stroke:var(--grain);stroke-width:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:10px}
.sw{display:inline-block;width:12px;height:12px;border:1px solid var(--ink);vertical-align:-1px;margin-right:6px}
.brand{background:#14213d;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand img{height:34px;width:auto;display:block}
.brand h1{color:#fff;margin:0;font-size:1.25rem;padding-left:16px;border-left:1px solid #3a4a6e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand{background:#0a101c}}
:root[data-theme="dark"] .brand{background:#0a101c}
.summary{display:none}
dl{margin:0}
dt{color:var(--muted);font-size:.8rem;margin-top:10px}
dd{margin:0;font-size:1.1rem;font-weight:800}
.dim{fill:var(--ink);font-weight:600}
.grn{fill:var(--grain);font-weight:800;letter-spacing:.1em}
.plab{fill:var(--ink);font-weight:600;stroke:var(--surface);paint-order:stroke}
@media (max-width:760px){
main{padding:16px 12px 32px}
.panel{padding:16px}
.brand{gap:10px 12px}
.brand h1{order:3;flex:1 1 100%;font-size:1.05rem;padding-left:0;border-left:0}
.printbtn{padding:10px 14px}
input,select,.printbtn{min-height:44px}
.stats{grid-template-columns:repeat(3,1fr);gap:10px}
.stat .v{font-size:1.6rem}
.stat .k{font-size:.75rem}
svg{max-height:75vh}
.legend{font-size:.8rem;gap:8px 14px}
}
.printbtn{margin-left:auto;font:inherit;font-weight:600;padding:9px 16px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.printbtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
@page{size:A4 landscape;margin:8mm}
@media print{
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#fff;--surface:#fff;--ink:#14213d;--muted:#5b6578;--line:#cfd6e2;--piece:#c9dcf5;--piece2:#f6d3c6;--grain:#5b7fb0;--accent:#e4572e;padding:0;color-scheme:light}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{background:#fff;font-size:12px}
.noprint{display:none!important}
.brand,:root[data-theme="dark"] .brand,:root:not([data-theme="light"]) .brand{background:#14213d;padding:8px 12px}
.brand img{height:28px}
.brand h1{font-size:1.1rem}
main{max-width:none;padding:8px 0 0}
.hint{display:none}
.grid{grid-template-columns:215px minmax(0,1fr);gap:12px}
.panel{padding:12px;break-inside:avoid}
h2{margin:0 0 8px}
label{font-size:11px;margin-bottom:2px}
input,select{padding:5px 8px;margin-bottom:8px;font-size:12px}
hr{margin:2px 0 10px}
.stats{margin-bottom:8px}
.stat .v{font-size:1.6rem}
.note{margin-bottom:8px;font-size:11px}
svg{max-height:160mm}
.results{display:grid;grid-template-columns:200px minmax(0,1fr);column-gap:14px;align-content:start}
.results .stats{grid-column:1;grid-row:1;grid-template-columns:1fr;gap:8px;margin-bottom:8px}
.results .note{grid-column:1;grid-row:2}
.results .legend{grid-column:1;grid-row:3}
.results #viz{grid-column:2;grid-row:1/span 3}
.inputs{display:none}
.summary{display:block}
.summary h2{font-size:1rem;margin-bottom:0}
dt{font-size:10px;margin-top:8px}
dd{font-size:15px}
.stat .v{font-size:2rem}
.stat .k{font-size:11px}
.legend{margin-top:6px}
}
</style>
</head>

<main>
<p class="hint">Sizes are in mm. Enter the sheet as width × length: the last number is the grain direction, so 640 × 915 is long grain and 915 × 640 is short grain.</p>
<div class="grid">
  <section class="panel inputs" aria-label="Inputs">
    <h2>Parent sheet</h2>
    <div class="row">
      <div><label for="sw">Width</label><input id="sw" type="number" inputmode="decimal" min="0" value="640"></div>
      <div><label for="sl">Length</label><input id="sl" type="number" inputmode="decimal" min="0" value="900"></div>
    </div>
    <label for="grain">Grain direction</label>
    <select id="grain"><option value="auto">Auto (from the last number)</option><option value="long">Long grain (override)</option><option value="short">Short grain (override)</option></select>
    <p class="note" id="gdetect" style="margin-top:-8px"></p>
    <hr>
    <h2>Cut size</h2>
    <div class="row">
      <div><label for="cw">Width</label><input id="cw" type="number" inputmode="decimal" min="0" value="210"></div>
      <div><label for="cl">Length</label><input id="cl" type="number" inputmode="decimal" min="0" value="297"></div>
    </div>
    <label for="cgrain">Grain required</label>
    <select id="cgrain"><option value="auto">Auto (most pieces)</option><option value="long">Long grain (override)</option><option value="short">Short grain (override)</option><option value="any">Either (no grain rule)</option></select>
    <label for="qty">Pieces required (optional)</label>
    <input id="qty" type="number" inputmode="numeric" min="0" placeholder="e.g. 5000">
  </section>
  <section class="panel summary" id="summary" aria-label="Job details"></section>
  <section class="panel results" aria-label="Result">
    <div class="stats">
      <div class="stat"><div class="v" id="n">0</div><div class="k">pieces per sheet</div></div>
      <div class="stat"><div class="v" id="waste">0%</div><div class="k">waste</div></div>
      <div class="stat"><div class="v" id="need">–</div><div class="k">sheets needed</div></div>
    </div>
    <p class="note" id="msg"></p>
    <div id="viz"></div>
    <div class="legend" id="legend"></div>
  </section>
</div>
</main>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var E=1e-9;
  function num(id){return parseFloat($(id).value)}
  function grid(x0,y0,W,H,o,g){
    var out=[];
    if(W<o[0]-E||H<o[1]-E)return out;
    var c=Math.floor((W+g)/(o[0]+g)+E),r=Math.floor((H+g)/(o[1]+g)+E);
    for(var i=0;i<c;i++)for(var j=0;j<r;j++)out.push({x:x0+i*(o[0]+g),y:y0+j*(o[1]+g),w:o[0],h:o[1],t:o[2]});
    return out;
  }
  function best(W,H,os,g){
    var c=os.map(function(o){return grid(0,0,W,H,o,g)});
    if(os.length===2){
      [[os[0],os[1]],[os[1],os[0]]].forEach(function(p){
        var a=p[0],b=p[1],k,s;
        for(k=1;k<600&&(s=k*(a[0]+g)-g)<=W+E;k++)c.push(grid(0,0,s,H,a,g).concat(grid(s+g,0,W-s-g,H,b,g)));
        for(k=1;k<600&&(s=k*(a[1]+g)-g)<=H+E;k++)c.push(grid(0,0,W,s,a,g).concat(grid(0,s+g,W,H-s-g,b,g)));
      });
    }
    return c.reduce(function(m,x){return x.length>m.length?x:m},[]);
  }
  function show(msg,bad){var m=$("msg");m.textContent=msg;m.className=bad?"note err":"note"}
  function calc(){
    var W=num("sw"),L=num("sl"),cw=num("cw"),cl=num("cl"),trim=0,gap=0,qty=num("qty");
    var sheetLongIsY=L>=W,pieceLongIsL=cl>=cw;
    var gv=$("grain").value;
    if(gv==="auto")gv=L>=W?"long":"short";
    var ga=(gv==="long")===sheetLongIsY?"y":"x";
    $("gdetect").textContent=(W>0&&L>0)?($("grain").value==="auto"?"Detected ":"Set manually: ")+gv+" grain, running along the "+(ga==="y"?L:W)+" side.":"";
    var rg=$("cgrain").value,req=rg==="any"?"any":((rg==="long")===pieceLongIsL?"l":"w");
    $("viz").innerHTML="";$("legend").innerHTML="";$("summary").innerHTML="";
    if(![W,L,cw,cl].every(function(v){return isFinite(v)&&v>0})){$("n").textContent="0";$("waste").textContent="0%";$("need").textContent="–";show("Enter the sheet size and the cut size.",false);return}
    if(trim<0)trim=0;if(gap<0)gap=0;
    var Wu=W-2*trim,Hu=L-2*trim;
    function plan(g2){
      var rq=g2==="any"?"any":((g2==="long")===pieceLongIsL?"l":"w");
      var a=rq==="any"||(rq==="l"&&ga==="y")||(rq==="w"&&ga==="x"),b=rq==="any"||(rq==="l"&&ga==="x")||(rq==="w"&&ga==="y"),o=[];
      if(a)o.push([cw,cl,0]);
      if(b)o.push([cl,cw,1]);
      return {okA:a,okB:b,os:o,r:Wu>0&&Hu>0?best(Wu,Hu,o,gap):[]};
    }
    var chosen=rg,autoTxt="";
    if(rg==="auto"){
      var pl=plan("long"),ps=plan("short");
      chosen=ps.r.length>pl.r.length?"short":"long";
      autoTxt="Auto picked "+chosen+" grain ("+pl.r.length+" pieces with long grain, "+ps.r.length+" with short grain). ";
    }
    var P=plan(chosen),okA=P.okA,okB=P.okB,os=P.os,r=P.r;
    var bw=0,bh=0;
    r.forEach(function(p){bw=Math.max(bw,p.x+p.w);bh=Math.max(bh,p.y+p.h)});
    var ox=r.length?(W-bw)/2:0,oy=r.length?(L-bh)/2:0,fm=function(v){return Math.round(v*10)/10};
    r.forEach(function(p){p.x+=ox;p.y+=oy});
    var n=r.length;
    $("n").textContent=n;
    var used=n*cw*cl;
    $("waste").textContent=(n?((1-used/(W*L))*100).toFixed(1):"100")+"%";
    $("need").textContent=(qty>0&&n>0)?Math.ceil(qty/n):"–";
    if(!n){show("The cut doesn’t fit on the sheet with this grain rule.",true)}
    else{
      var rot=r.filter(function(p){return p.t===1}).length;
      var txt=okA&&okB?(rot===0?"Best layout keeps every piece the same way round.":(rot===n?"Best layout turns every piece through 90°.":"Best layout mixes both orientations ("+(n-rot)+" upright, "+rot+" turned)."))
        :(okA?"The grain rule fixes the orientation: pieces are cut the same way round.":"The grain rule fixes the orientation: pieces are turned 90° on the sheet.");
      txt+=" Offcut is split evenly round the rim: "+fm(ox)+" mm left and right, "+fm(oy)+" mm top and bottom.";
      if(qty>0)txt+=" "+qty+" pieces need "+Math.ceil(qty/n)+" sheets.";
      show(autoTxt+txt,false);
    }
    var pad=Math.max(W,L)*0.1,s=Math.max(W,L)/45,fs=Math.max(W,L)/30;
    var pat=ga==="y"?'<line x1="'+s/2+'" y1="0" x2="'+s/2+'" y2="'+s+'"/>':'<line x1="0" y1="'+s/2+'" x2="'+s+'" y2="'+s/2+'"/>';
    var svg='<svg viewBox="'+(-pad)+' '+(-pad)+' '+(W+2*pad)+' '+(L+2*pad)+'" role="img" aria-label="Cutting layout">'
      +'<defs><pattern id="gr" class="pat" width="'+s+'" height="'+s+'" patternUnits="userSpaceOnUse">'+pat+'</pattern></defs>'
      +'<rect class="sheet" x="0" y="0" width="'+W+'" height="'+L+'" vector-effect="non-scaling-stroke"/>'
      +(trim>0?'<rect class="usable" x="'+trim+'" y="'+trim+'" width="'+Wu+'" height="'+Hu+'" vector-effect="non-scaling-stroke"/>':'')
      +'<rect x="0" y="0" width="'+W+'" height="'+L+'" fill="url(#gr)"/>';
    r.forEach(function(p){
      var x=p.x+trim,y=p.y+trim;
      svg+='<rect class="p'+p.t+'" x="'+x+'" y="'+y+'" width="'+p.w+'" height="'+p.h+'" fill-opacity=".85" vector-effect="non-scaling-stroke"/>'
         +'<rect x="'+x+'" y="'+y+'" width="'+p.w+'" height="'+p.h+'" fill="url(#gr)"/>';
    });
    r.forEach(function(p){
      if(p.w>fs*5.2&&p.h>fs*1.8)svg+='<text class="plab" x="'+(p.x+trim+p.w/2)+'" y="'+(p.y+trim+p.h/2)+'" font-size="'+(fs*.85)+'" stroke-width="'+(fs*.18)+'" text-anchor="middle" dominant-baseline="central">'+p.w+' × '+p.h+'</text>';
    });
    svg+='<text class="dim" x="'+(W/2)+'" y="'+(-pad*.4)+'" font-size="'+fs+'" text-anchor="middle">'+W+' mm</text>'
      +'<text class="dim" transform="translate('+(-pad*.4)+' '+(L/2)+') rotate(-90)" font-size="'+fs+'" text-anchor="middle">'+L+' mm</text>'
      +(ga==="y"?'<text class="grn" transform="translate('+(W+pad*.65)+' '+(L/2)+') rotate(90)" font-size="'+(fs*.85)+'" text-anchor="middle">← GRAIN →</text>':'<text class="grn" x="'+(W/2)+'" y="'+(L+pad*.75)+'" font-size="'+(fs*.85)+'" text-anchor="middle">← GRAIN →</text>');
    $("viz").innerHTML=svg+'</svg>';
    var cap=function(t){return t.charAt(0).toUpperCase()+t.slice(1)},row=function(k,v){return '<dt>'+k+'</dt><dd>'+v+'</dd>'};
    var cutGrain=rg==="any"?"Either way (no grain rule)":cap(chosen)+" grain"+(rg==="auto"?" (auto, most pieces)":"");
    $("summary").innerHTML='<h2>Job details</h2><dl>'+row('Parent sheet',W+' × '+L+' mm')+row('Sheet grain',cap(gv)+' grain, along the '+(ga==="y"?L:W)+' mm side')+row('Cut size',cw+' × '+cl+' mm')+row('Cut grain',cutGrain)+row('Offcut round rim',fm(ox)+' mm left and right, '+fm(oy)+' mm top and bottom')+(qty>0?row('Pieces required',qty):'')+row('Printed',new Date().toLocaleDateString('en-ZA'))+'</dl>';
    var lg='<span>Fine lines show the grain, running '+(ga==="y"?"top to bottom":"left to right")+' on the sheet.</span>';
    if(os.length===2)lg='<span><i class="sw" style="background:var(--piece)"></i>Upright</span><span><i class="sw" style="background:var(--piece2)"></i>Turned 90°</span>'+lg;
    $("legend").innerHTML=lg;
  }
  ["sw","sl","grain","cw","cl","cgrain","qty"].forEach(function(id){$(id).addEventListener("input",calc);$(id).addEventListener("change",calc)});
  $("print").addEventListener("click",function(){try{window.print()}catch(e){}});
  calc();
})();
</script>
</body>
</html>
